# Fork-only release pipeline.
#
# Upstream's `release.yml` cannot be used on a fork: same owner gate as
# `run_tests.yml`, namespace/self-hosted runners, Apple + Azure signing
# secrets, and it uploads to `zed-industries/zed`. This workflow runs the
# repo's *own* bundle scripts on GitHub-hosted runners and attaches the
# artifacts to a release on this repository.
#
# Deliberate limitations, all consequences of having no signing secrets:
#   - macOS: ad-hoc signed only (`--sign -`), not notarized. First launch needs
#     right-click -> Open, or `xattr -dr com.apple.quarantine`.
#   - Windows: unsigned, so SmartScreen warns about an unknown publisher.
#   - Linux: self-contained tar.gz, no signing step exists there anyway.
#   - Crash/symbol reporting stays off: ZED_SENTRY_* / ZED_MINIDUMP_ENDPOINT
#     and ZED_CLIENT_CHECKSUM_SEED are unset, and every consumer treats them
#     as optional (`option_env!`).
#
# The release channel stays `dev` (see `crates/zed/RELEASE_CHANNEL`), which
# makes `ReleaseChannel::poll_for_updates()` return false: these builds never
# auto-update. Do NOT switch it to `stable` to "look like real Zed" - stable
# polls for updates and would silently replace this fork's localization with
# the official build.
name: fork_release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build. Leave empty to build the selected ref.'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # `script/determine-release-channel` is not usable here: it rejects any
  # channel other than stable/preview, and this fork builds on `dev`.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - id: version
        name: read crate version
        run: echo "version=$(script/get-crate-version zed)" >> "$GITHUB_OUTPUT"
      - name: show what is being built
        run: |
          echo "tag: ${{ inputs.tag || github.ref_name }}"
          echo "crate version: ${{ steps.version.outputs.version }}"
          echo "channel: $(cat crates/zed/RELEASE_CHANNEL)"
          # The updater compares the release tag against the version compiled
          # into the installed binary and only offers strictly newer versions,
          # so a tag that disagrees with the crate version must not be
          # published: publishing it would offer the same update over and over.
          tag="${{ inputs.tag || github.ref_name }}"
          if [ "$tag" != "v${{ steps.version.outputs.version }}" ]; then
            echo "::warning::tag $tag does not match the crate version; the build will run but publishing will fail"
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # Upstream's bundle jobs for the 3 platforms this fork can build
          # without signing secrets. Drop an entry to skip a platform.
          # macos-latest is arm64, which is why only the aarch64 dmg is built.
          - name: linux-x86_64
            os: ubuntu-latest
            bundle: ./script/bundle-linux
            rustflags: -C link-arg=-fuse-ld=lld
            codegen_units: 4
            assets: |
              target/release/zed-linux-x86_64.tar.gz
              target/zed-remote-server-linux-x86_64.gz
          - name: windows-x86_64
            # windows-2022, not windows-latest: bundle-windows.ps1 runs Inno
            # Setup 6 from `C:\Program Files (x86)\Inno Setup 6\ISCC.exe`, which
            # the 2022 image ships and the 2025 image does not.
            os: windows-2022
            bundle: script/bundle-windows.ps1 -Architecture x86_64
            rustflags: ''
            codegen_units: 4
            assets: |
              target/Zed-x86_64.exe
              target/zed-remote-server-windows-x86_64.zip
          - name: macos-aarch64
            os: macos-latest
            bundle: ./script/bundle-mac aarch64-apple-darwin
            rustflags: ''
            # GitHub-hosted macOS runners have only 7 GB RAM (3 vCPUs). Setting codegen_units to 1
            # prevents memory thrashing/swap lockup during LLVM codegen on large crates like git_ui.
            codegen_units: 1
            assets: |
              target/aarch64-apple-darwin/release/Zed-aarch64.dmg
              target/zed-remote-server-macos-aarch64.gz
    runs-on: ${{ matrix.os }}
    # A release build on a free 4-vCPU runner is slow; the job limit is 6h.
    timeout-minutes: 350
    env:
      CARGO_INCREMENTAL: 0
      # Maximize parallel code generation on 16GB runners (4), but 1 on 7GB macOS runner to avoid swap thrashing
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ matrix.codegen_units }}
      # Baked into the binary by `option_env!` in crates/auto_update: it is what
      # makes "Check for Updates" look at this repository's releases instead of
      # Zed Cloud. Unset for upstream builds, which keeps them unchanged.
      ZED_FORK_RELEASE_REPO: ${{ github.repository }}
      # bundle-windows.ps1 requires these two once CI is set.
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      ZED_WORKSPACE: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.8.2
      - uses: Swatinem/rust-cache@v2
        with:
          # Release builds produce tens of GB of target/ artifacts across 3 platforms.
          # Caching target/ would immediately exceed GitHub's 10 GB repo quota and evict
          # the daily fork_check cache. Caching only crates.io dependencies (~500 MB)
          # speeds up downloads while keeping cache usage permanently within bounds.
          cache-targets: false
      # A release build of Zed is tens of GB; the hosted runners are far
      # tighter than upstream's. Free what the build cannot possibly need.
      - name: free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL"
          sudo apt-get clean
          df -h /
      - name: free disk space
        if: runner.os == 'macOS'
        run: |
          sudo rm -rf /Library/Developer/CoreSimulator/Caches \
                      /Library/Developer/CoreSimulator/Profiles/Runtimes \
                      ~/Library/Developer/Xcode/DerivedData
          df -h /
      - name: system dependencies
        if: runner.os == 'Linux'
        run: ./script/linux
      - name: download wasi sdk
        if: runner.os == 'Linux'
        run: ./script/download-wasi-sdk
      # bundle-mac shells out to npm for `dmg-license`.
      - uses: actions/setup-node@v7
        if: runner.os == 'macOS'
      - name: generate licenses
        if: runner.os != 'Windows'
        run: ./script/generate-licenses
      - name: bundle
        if: runner.os != 'Windows'
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: ${{ matrix.bundle }}
      # Split from the step above instead of `shell: ${{ matrix.shell }}`:
      # `shell` does not accept the `matrix` context. Upstream pins
      # `shell: pwsh` for the Windows bundle rather than trusting the runner
      # default, so keep it explicit.
      - name: bundle (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ${{ matrix.bundle }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.assets }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs:
      - version
      - build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: flatten assets
        run: |
          find dist -mindepth 2 -type f -exec mv -t dist {} +
          find dist -mindepth 1 -type d -delete
      - name: list assets
        run: ls -lh dist
      - name: check tag matches the crate version
        run: |
          set -euo pipefail
          # The updater's version comparison only offers a release whose tag
          # version is strictly newer than the version compiled into the
          # installed binary. Publishing a tag that disagrees with the crate
          # version would make every "Check for Updates" offer the same update
          # again, so refuse to publish it.
          if [ "$TAG" != "v${{ needs.version.outputs.version }}" ]; then
            echo "::error::tag $TAG does not match crate version ${{ needs.version.outputs.version }} (expected v${{ needs.version.outputs.version }}). Bump the zed crate version, commit it, then tag that commit."
            exit 1
          fi
      - name: publish
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          Zed 汉化版 · ${{ needs.version.outputs.version }}

          ## 下载

          | 平台 | 文件 |
          | --- | --- |
          | Windows x86_64 | `Zed-x86_64.exe` |
          | Linux x86_64 | `zed-linux-x86_64.tar.gz` |
          | macOS arm64 (Apple Silicon) | `Zed-aarch64.dmg` |

          `zed-remote-server-*` 是远程开发用的服务端组件，正常使用编辑器不需要单独下载。

          ## 注意

          - 本构建**未做代码签名**：macOS 首次打开请右键 → 打开（或执行
            `xattr -dr com.apple.quarantine /Applications/Zed\ Dev.app`）；Windows 会看到
            SmartScreen 的未知发布者提示。
          - 构建渠道为 `dev`，应用名显示为 **Zed Dev**（Linux 上为 `Zed Devel`）。
            菜单里的「检查更新」会从**本仓库的 Release** 取新版，可直接在应用内下载安装并重启；
            但**没有后台自动更新**（否则官方版会覆盖汉化）。
          - 界面语言默认跟随系统区域；可在设置里用 `language` 项改为 `zh-CN` / `en`。
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --notes-file notes.md dist/*
          fi

# Fork-only smoke CI. Upstream workflows are gated on
# `github.repository_owner == 'zed-industries'` and always skip on forks,
# so this file runs the checks a fork actually needs on free runners.
# Deliberately NOT generated by `cargo xtask workflows`; do not add it there.
#
# Everything here is fast. The compile check lives in `fork_check.yml`.
name: fork_ci
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/fork_disable_upstream.yml'
      - '.github/workflows/fork_release.yml'
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/fork_disable_upstream.yml'
      - '.github/workflows/fork_release.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: l10n boundary check
        run: ./script/check-l10n-boundary
      - name: l10n strict audit
        run: ./script/extract-l10n --strict
      - name: locale unit tests
        run: cargo test -p locale

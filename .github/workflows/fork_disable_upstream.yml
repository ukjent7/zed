# Fork-only maintenance: park the upstream workflows that cannot run here.
#
# Two reasons a workflow on this fork is pure noise:
#   1. it is gated on `github.repository_owner == 'zed-industries'` (or
#      'zed-extensions') and/or scheduled on namespace-profile / self-hosted
#      runners that a fork does not have, so it always skips;
#   2. it is upstream community automation that needs the upstream Projects
#      board, Slack webhooks or GitHub App tokens, so on a fork it only fails.
#
# Disabling beats deleting: the files stay identical to upstream, so merging
# upstream never conflicts, and this is GitHub's own recommendation for forks
# ("Workflows on a forked repository that aren't needed").
#
# Deliberately NOT listed:
#   - scheduled workflows: GitHub already parks those as `disabled_fork` when a
#     public repository is forked, which is why a `schedule:` trigger here
#     would not even run;
#   - `workflow_dispatch`-only and `workflow_call`-only workflows
#     (bump_*, cherry_pick, autofix_pr, publish_extension_cli, deploy_docs,
#     extension_bump, extension_tests, ...): they never fire on their own, so
#     disabling them would change nothing. GitHub keeps them `active` forever,
#     so the drift check below reads each file's `on:` block to recognise this
#     class rather than carrying a second copy of the list by hand.
#
# A merge from upstream can invalidate the parked state, and the two halves are
# handled differently:
#   - a *listed* workflow that upstream re-enabled is fixed automatically - the
#     `paths` filter below re-runs this job on any workflow change and the PUT
#     parks it again;
#   - a *new* upstream workflow is not in the list, so no re-run can park it.
#     The job's drift check fails and names it instead of going green, so the
#     list gets the entry it is missing.
# If the API call returns 403, the repository's Actions token is read-only -
# either allow write access (Settings -> Actions -> General -> Workflow
# permissions) or disable the workflows by hand (Actions -> workflow ->
# "Disable workflow").
name: fork_disable_upstream
on:
  workflow_dispatch:
  push:
    branches:
      - main
    # Any workflow file can invalidate the parked state, not just this one: a
    # merge from upstream may modify a listed workflow (GitHub can bring it
    # back enabled) or add a new one that is not in the list yet. Watching the
    # whole directory makes that self-correcting instead of relying on someone
    # remembering to re-run this by hand after every merge.
    paths:
      - '.github/workflows/**'
permissions:
  actions: write
  # An explicit `permissions` block sets every other scope to `none`, and
  # `actions/checkout` below needs `contents: read` to fetch the tree that the
  # drift check reads triggers out of.
  contents: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  disable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: disable workflows that can never run on a fork
        run: |
          set -euo pipefail

          workflows=(
            # --- gated on zed-industries / unavailable runners ---
            run_tests.yml                     # owner gate + namespace mac/windows runners
            release.yml                       # owner gate + Apple/Azure secrets, uploads to zed-industries/zed
            run_bundling.yml                  # namespace/self-hosted runners
            deploy_collab.yml                 # deploy step gated to zed-industries
            deploy_nightly_docs.yml           # gated to zed-industries
            nix_build.yml                     # gated to zed-industries
            congrats.yml                      # gated to zed-industries
            danger.yml                        # gated to zed-industries
            extension_auto_bump.yml           # pushes to zed-industries/zed
            after_release.yml                 # triggered by the `release` event, gated
            # --- upstream community automation (Projects board / Slack / labels) ---
            add_commented_closed_issue_to_project.yml
            catch_blank_issues.yml
            comment_on_potential_duplicate_issues.yml
            community_pr_board.yml
            docs_suggestions.yml
            good_first_issue_notifier.yml
            guild_assignment_status.yml
            guild_new_pr_notify.yml
            maintainer_edits_nudge.yml
            pr_issue_labeler.yml
            slack_notify_community_automation_failure.yml
            slack_notify_first_responders.yml
            slack_notify_label_created.yml
          )

          # One listing decides who needs a PUT at all. Calling `disable` on a
          # workflow that is already parked is what turned this job red on its
          # second run: the first run had parked all 23, so every entry was
          # already `disabled_manually` and GitHub rejects the repeat call.
          total=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows" \
                    --jq '.total_count')
          if [ "${total}" -gt 100 ]; then
            # `per_page=100` below would silently miss the rest, and a workflow
            # that is never listed looks "already parked". Say so instead.
            echo "::error::${total} workflows exceed the single page this job reads; paginate before trusting it"
            exit 1
          fi

          # The two checks below judge a workflow by what it declares, so read
          # that from the tree rather than trusting a name or a state string.
          #
          # Top-level `on:` trigger names of a workflow file: the keys at the
          # indent of the block's first entry, with comments and nested keys
          # dropped. Covers the block, sequence (`- push`) and inline
          # (`on: [push]`) spellings. Prints nothing for anything it cannot
          # read - a quoted `"on":` key, say - and the caller treats that as
          # "unknown", never as "no triggers".
          on_triggers() {
            awk '
              BEGIN { in_on = 0; ind = 0 }
              { sub(/\r$/, "") }
              !in_on {
                if ($0 ~ /^on:[ \t]*$/) { in_on = 1; next }
                if ($0 ~ /^on:[ \t]*[^ \t]/) {
                  sub(/^on:[ \t]*/, "")
                  gsub(/[^A-Za-z0-9_]/, " ")
                  print
                  exit
                }
                next
              }
              /^[ \t]*$/ { next }
              /^[ \t]*#/ { next }
              !/^[ \t]/ { exit }
              {
                key = $0
                lead = length(key)
                sub(/^[ \t]+/, "", key)
                lead -= length(key)
                if (!ind) ind = lead
                if (lead > ind) next
                if (lead < ind) exit
                if (key ~ /^-/) {
                  sub(/^- +/, "", key)
                  if (key ~ /:/) next
                } else {
                  sub(/:.*/, "", key)
                }
                gsub(/[^A-Za-z0-9_]/, "", key)
                print key
              }
            ' "$1" | paste -sd ' ' -
          }

          # Can these triggers start a run by themselves? `workflow_dispatch`
          # needs a person to press the button and `workflow_call` needs a
          # caller, which on a fork means a workflow that is itself parked, so a
          # file whose triggers are all of those two is inert however GitHub
          # labels its record.
          fires_by_itself() {
            local trigger
            for trigger in $1; do
              case "${trigger}" in
                workflow_dispatch | workflow_call) ;;
                *) return 0 ;;
              esac
            done
            return 1
          }

          active=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" \
                     --jq '.workflows[] | select(.state == "active") | .path' \
                   | sed 's|^.*/||')

          failed=()
          for workflow in "${workflows[@]}"; do
            printf '%-56s ' "${workflow}"
            if ! grep -qx "${workflow}" <<<"${active}"; then
              echo 'already parked'
              continue
            fi
            if [ ! -f ".github/workflows/${workflow}" ]; then
              # Upstream deleted it. GitHub keeps the record - and keeps calling
              # it active - for a while after the file goes, so the PUT has
              # nothing to act on and the entry above is just stale.
              echo 'gone from the tree (drop it from the list above)'
              continue
            fi
            if err=$(gh api --silent -X PUT \
                 "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/disable" 2>&1); then
              echo 'disabled'
            else
              # Surface what the API actually said. Swallowing it and blaming a
              # read-only token for every failure sent the diagnosis down the
              # wrong path once already: the real cause was a repeat call on an
              # already-disabled workflow, which the check above now avoids.
              echo "FAILED (${err})"
              failed+=("${workflow}")
            fi
          done

          if ((${#failed[@]})); then
            echo "::error::could not disable ${#failed[@]} workflow(s): ${failed[*]}"
            echo "A 403 means the repository's Actions token lacks write access"
            echo "(Settings -> Actions -> General -> Workflow permissions). The"
            echo "API error printed next to each FAILED entry says which it was."
            exit 1
          fi

          # Drift: a newly merged upstream workflow is invisible to the loop
          # above, because it is not in the list at all - the job would go green
          # while that workflow keeps running here. Being `active` is not enough
          # to call one drift, though, because that is also the state GitHub
          # leaves every dispatch-only file in; the verdict has to come from the
          # file. So of the active workflows this file does not track (`fork_*`
          # being the fork's own), fail only on the ones that can fire.
          untracked=$(
            printf '%s\n' ${active:-} \
              | grep -vx -F -f <(printf '%s\n' "${workflows[@]}") \
              | grep -v '^fork_' || true
          )

          drift=()
          while IFS= read -r workflow; do
            if [ -z "${workflow}" ]; then
              continue
            elif [ ! -f ".github/workflows/${workflow}" ]; then
              echo "${workflow}: active but not in this commit, so it cannot run"
              continue
            fi
            triggers=$(on_triggers ".github/workflows/${workflow}")
            if [ -z "${triggers}" ]; then
              drift+=("${workflow} (triggers unread: check its on: block by hand)")
            elif fires_by_itself "${triggers}"; then
              drift+=("${workflow} (${triggers})")
            fi
          done <<<"${untracked}"

          if ((${#drift[@]})); then
            echo "::error::workflow(s) that fire here but are not tracked by this file:"
            printf '  %s\n' "${drift[@]}"
            echo "Add each to the list above - or, if a fork can never run it,"
            echo "park it in the Actions UI and note why here."
            exit 1
          fi

      - name: show remaining non-active workflows
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" \
            --jq '.workflows[] | select(.state != "active") | "\(.state)\t\(.path)"' | sort

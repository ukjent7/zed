# Fork-only compile check.
#
# Upstream's `run_tests.yml` (and the rest of the release pipeline) is gated on
# `github.repository_owner == 'zed-industries' || github.repository_owner ==
# 'zed-extensions'`, so it never runs on a fork. The smoke job in `fork_ci.yml`
# only builds the `locale` crate, which cannot catch a broken `locale::t()`
# call site in a UI crate. This workflow is the only thing that compiles the
# fork's own changes.
#
# Cost: compiling the dependency graph of the touched crates is most of Zed, so
# this is a slow job (tens of minutes on a free runner). It is split out from
# `fork_ci.yml` so the fast checks still report in seconds, and so this job can
# be disabled on its own if it ever becomes too slow.
name: fork_check
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/fork_disable_upstream.yml'
      - '.github/workflows/fork_release.yml'
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/fork_disable_upstream.yml'
      - '.github/workflows/fork_release.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: 0
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # gpui and the zed binary need xkbcommon, wayland, alsa, ... on Linux.
      # Reusing upstream's own bootstrap keeps the list from drifting.
      - name: system dependencies
        run: ./script/linux
      # Checking `zed` transitively compiles and checks all UI crates
      # (auto_update, git_ui, workspace, settings_ui, locale, etc.) as direct
      # non-optional dependencies. Omitting `--all-targets` avoids compiling
      # test harnesses and 170+ dev-dependencies of untouched crates; locale's
      # unit tests already run in fork_ci. Any newly localized crate added to
      # Zed is automatically covered here without manual list maintenance.
      - name: cargo check
        run: |
          cargo check --locked -p zed

# Fork-only compile check.
#
# Upstream's `run_tests.yml` (and the rest of the release pipeline) is gated on
# `github.repository_owner == 'zed-industries' || github.repository_owner ==
# 'zed-extensions'`, so it never runs on a fork. The smoke job in `fork_ci.yml`
# only builds the `locale` crate, which cannot catch a broken `locale::t()`
# call site in a UI crate. This workflow is the only thing that compiles the
# fork's own changes.
#
# Cost: compiling the dependency graph of the touched crates is most of Zed, so
# this is a slow job (tens of minutes on a free runner). It is split out from
# `fork_ci.yml` so the fast checks still report in seconds, and so this job can
# be disabled on its own if it ever becomes too slow.
name: fork_check
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/fork_disable_upstream.yml'
      - '.github/workflows/fork_release.yml'
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/fork_disable_upstream.yml'
      - '.github/workflows/fork_release.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: 0
jobs:
  # `cargo check -p zed` compiles the branch of every dependency that matches
  # the *host* target only, so `#[cfg(target_os = "macos")]` code is invisible
  # to the Linux job. The fork localizes `crates/auto_update`, whose platform
  # branches differ per OS — `check_dependencies()` renders a translated string
  # under `#[cfg(target_os = "macos")]` alone — so a type error there survives
  # this workflow entirely and only surfaces when `fork_release` packages a tag.
  #
  # macOS is the runner added here because that is where the localized branch
  # actually lives; the Windows branches hold no `locale::` call today, and a
  # Windows runner would roughly double the job time for no coverage gained.
  # Revisit both counts when platform-specific code gains new translations.
  #
  # `cargo check` does not link, so the macOS runner needs no bootstrap script:
  # `./script/linux` exists only because Linux runners lack xkbcommon/wayland.
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bootstrap: ./script/linux
          - os: macos-latest
            bootstrap: ''
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: system dependencies
        if: matrix.bootstrap != ''
        run: ${{ matrix.bootstrap }}
      # Checking `zed` transitively compiles and checks all UI crates
      # (auto_update, git_ui, workspace, settings_ui, locale, etc.) as direct
      # non-optional dependencies. Omitting `--all-targets` avoids compiling
      # test harnesses and 170+ dev-dependencies of untouched crates; locale's
      # unit tests already run in fork_ci. Any newly localized crate added to
      # Zed is automatically covered here without manual list maintenance.
      - name: cargo check
        run: |
          cargo check --locked -p zed

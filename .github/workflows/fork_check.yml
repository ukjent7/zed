# Fork-only compile check.
#
# Upstream's `run_tests.yml` (and the rest of the release pipeline) is gated on
# `github.repository_owner == 'zed-industries' || github.repository_owner ==
# 'zed-extensions'`, so it never runs on a fork. The smoke job in `fork_ci.yml`
# only builds the `locale` crate, which cannot catch a broken `locale::t()`
# call site in a UI crate. This workflow is the only thing that compiles the
# fork's own changes.
#
# Cost: compiling the dependency graph of the touched crates is most of Zed, so
# this is a slow job (tens of minutes on a free runner). It is split out from
# `fork_ci.yml` so the fast checks still report in seconds, and so this job can
# be disabled on its own if it ever becomes too slow.
name: fork_check
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # gpui and the zed binary need xkbcommon, wayland, alsa, ... on Linux.
      # Reusing upstream's own bootstrap keeps the list from drifting.
      - name: system dependencies
        run: ./script/linux
      # Every crate the fork has touched. `--all-targets` matters: the test
      # modules were edited too, and a plain `cargo check` would not compile
      # them. Add new crates here when the fork starts editing them.
      - name: cargo check
        run: |
          cargo check --locked --all-targets \
            -p auto_update \
            -p command_palette \
            -p extensions_ui \
            -p file_finder \
            -p git_ui \
            -p keymap_editor \
            -p locale \
            -p onboarding \
            -p outline_panel \
            -p project_panel \
            -p recent_projects \
            -p search \
            -p settings \
            -p settings_content \
            -p settings_ui \
            -p terminal_view \
            -p title_bar \
            -p ui \
            -p workspace \
            -p zed
